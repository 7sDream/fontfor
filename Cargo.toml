[package]
name = "fontfor"
version = "0.5.0-alpha.1"
authors = ["7sDream <i@7sdre.am>"]
edition = "2024"
description = "find fonts which can show a specified character and preview them in terminal or browser"
homepage = "https://github.com/7sDream/fontfor"
repository = "https://github.com/7sDream/fontfor"
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["font", "character", "cli", "utilities"]
categories = ["command-line-utilities", "text-processing", "visualization"]

[dependencies]
# Define error type
thiserror = "2.0.18"

# 2D array
grid = "1.0.1"

# CLI argument parser
clap = { version = "4.6.1", features = ["derive", "unicode", "wrap_help"] }

# Font loader
fontique = { version = "0.11.0", default-features = false, features = ["std"] }
skrifa = "0.43.2" # use non-latest version to match with fontique's read-fonts version

# Filter fonts
range-set-blaze = "0.6.0"

# Font rasterizer
# see https://gist.github.com/7sDream/0bb194be42b8cb1f1926ca12151c8d76 for alternatives.
ab_glyph_rasterizer = "0.1.10"

# Terminal UI
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm",
] }

# Input widget for filter in TUI
tui-input = "0.15.3"

# Home-made single thread HTTP server for preview fonts in browser.
# Alternative: output a html file into temp dir and open it
httparse = "1.10.1"

# Logger
log = { version = "0.4.33", features = ["release_max_level_off"] }
env_logger = { version = "0.11.11", optional = true }

# Disable system feature for linux/freebsd
[target.'cfg(not(any(target_os = "linux", target_os="freebsd")))'.dependencies]
fontique = { version = "0.11.0", features = ["system"] }

[features]
default = []
log-output = ["dep:env_logger"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Can't understand in what situation this lint would be useful. 
# If I need a [number] but am given a [range], the compilation won't even pass anyway...
single_range_in_vec_init = "allow"

[profile.dev.package]
read-fonts = { opt-level = 3 }
grid = { opt-level = 3 }

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
